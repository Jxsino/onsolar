  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c22158ea-27b8-4485-947d-7177e291e174\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"3b9113d1-51f8-4edc-9029-660dbba98ff0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"68f85f97-8521-4580-93b4-ce022b9a5334\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9be3250b-abc6-442e-8386-47d1618b28cc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #161826;\n  --color-surface: #232532;\n  --color-text: #e9e9ed;\n  --color-accent: #9184d9; /* review round 7 (Barron): the accent moves to\n     the product's blurple — OKLCH hue 289.2, the hue of the app's own Pro\n     accent (#9a8fe0, --om-accent-pro) — at the same lightness the steel\n     accent held (L 0.660, so the documented ratios survive) and chroma\n     in the product blurple's own range (its token sits at C 0.118; the\n     accent takes 0.125, from the old steel's 0.030):\n     the accent now reads as an accent rather than another neutral. */\n  --color-accent-2: #a7a1db; /* the machine-derived stand-in follows: same\n     hue, same L 0.734, chroma at the same 2:3 proportion it held */\n  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f3f5fe;\n  --color-neutral-200: #e4e7f5;\n  --color-neutral-300: #cfd3e5;\n  --color-neutral-400: #b2b6ca;\n  --color-neutral-500: #9397ab;\n  --color-neutral-600: #75798c;\n  --color-neutral-700: #595d6c;\n  --color-neutral-800: #3f424d;\n  --color-neutral-900: #292b31;\n\n  --color-accent-100: #f5f4ff;\n  --color-accent-200: #e7e5fe;\n  --color-accent-300: #d2cefd;\n  --color-accent-400: #b5abfc;\n  --color-accent-500: #968ae0;\n  --color-accent-600: #796cbf;\n  --color-accent-700: #5d5294;\n  --color-accent-800: #423a6a;\n  --color-accent-900: #2b2741;\n\n  --color-accent-2-100: #f5f4ff;\n  --color-accent-2-200: #e7e5fe;\n  --color-accent-2-300: #d2cefd;\n  --color-accent-2-400: #b5afe8;\n  --color-accent-2-500: #9690c9;\n  --color-accent-2-600: #7972a9;\n  --color-accent-2-700: #5c5783;\n  --color-accent-2-800: #423e5d;\n  --color-accent-2-900: #2b293a;\n\n  /* Deck section-divider ground — review round 3: saturation as presence.\n     Dividers take a saturated deep indigo (hue 277, the neutral ramp's own\n     family; C 0.094 — written when the accent held C 0.030, before the\n     round-7 blurple raised it past the ground's) with a lighter bloom and\n     a ghost tint of the same hue, while the slide grounds stay\n     desaturated. Deck-scale fills only — not interface colors. */\n  --color-section: #262a60;\n  --color-section-glow: #353b80;\n  --color-section-ghost: #4c5397;\n\n  --font-heading: \"Inter\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: \"Inter\", system-ui, sans-serif;\n\n  --space-1: 2.8px;\n  --space-2: 5.6px;\n  --space-3: 8.4px;\n  --space-4: 11.2px;\n  --space-6: 16.8px;\n  --space-8: 22.4px;\n\n  --radius-sm: 4px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 0 0 1px #3f424d;\n  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);\n  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.lighten{mix-blend-mode:lighten;background-color:transparent}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n/* Rules fade to transparent at both ends instead of stopping cleanly — a\n   Nocturne signature. The ramp is 48px an end (one deck baseline unit),\n   painted from the same divider token. Freestanding rules fade; box\n   outlines, in-control separators, and short accent marks stay solid. */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }\n.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }\n.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid transparent; /* keeps layout; the row paints the fading rule */\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid transparent;\n}\n/* Row rules as row-level strips so the end-fade spans the row, not each cell. */\n.table thead tr {\n  background: linear-gradient(to right,\n    transparent, var(--color-divider) 48px,\n    var(--color-divider) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr {\n  background: linear-gradient(to right,\n    transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n    color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n.table tbody tr:hover {\n  /* the hover tint layers over the row rule, which keeps painting */\n  background:\n    linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent),\n                    color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%,\n    linear-gradient(to right,\n      transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 48px,\n      color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 48px), transparent) no-repeat bottom / 100% 1px;\n}\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"1dae6955-e7c4-49ff-af83-0bd2b72503ec\"><\u002Fscript>\n<script src=\"960f46d9-18d1-4933-874a-8e84d72169cd\"><\u002Fscript>\n<script src=\"c9921977-0f44-4740-8a11-05dba74e81d6\"><\u002Fscript>\n<style>\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:#270D3A;color:#FFFFFF;font-family:\"Inter\",system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#FFC700;text-decoration:none}\na:hover{color:#FFE07A}\n::selection{background:rgba(255,199,0,.3)}\ninput:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #FFC700;outline-offset:2px}\ninput[type=range]{accent-color:#FFC700}\ninput::placeholder{color:#9C88B0}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh;background:#270D3A;overflow-x:hidden\">\n\n<!-- NAV -->\n<header style=\"position:sticky;top:0;z-index:20;background:rgba(39,13,58,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)\">\n  <nav style=\"max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px\">\n    <a href=\"#topo\" style=\"display:flex;align-items:center\" aria-label=\"ON Solar — início\">\n      <img src=\"e05dbe62-ee13-4fad-9e24-d870b72566af\" alt=\"ON Solar\" style=\"height:44px;width:auto;mix-blend-mode:lighten\">\n    <\u002Fa>\n    <div style=\"display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:flex-end\">\n      <div style=\"display:flex;gap:24px;font-size:14px;font-weight:500\">\n        <a href=\"#como-funciona\" style=\"color:#D9CCE6\" style-hover=\"color:#FFFFFF\">Como funciona<\u002Fa>\n        <a href=\"#beneficios\" style=\"color:#D9CCE6\" style-hover=\"color:#FFFFFF\">Benefícios<\u002Fa>\n        <a href=\"#clientes\" style=\"color:#D9CCE6\" style-hover=\"color:#FFFFFF\">Clientes<\u002Fa>\n        <a href=\"#faq\" style=\"color:#D9CCE6\" style-hover=\"color:#FFFFFF\">Dúvidas<\u002Fa>\n      <\u002Fdiv>\n      <a href=\"#simular\" style=\"display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid #FFC700;color:{{ctaFg}};background:{{ctaBg}};font-size:14px;font-weight:500\" style-hover=\"background:rgba(255,199,0,.16)\">\n        Simular economia <i class=\"ph ph-arrow-right\"><\u002Fi>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n  <div style=\"height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14) 10%,rgba(255,255,255,.14) 90%,transparent)\"><\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section id=\"topo\" data-screen-label=\"Hero\" style=\"position:relative;background:radial-gradient(ellipse 60% 70% at 92% -10%,rgba(255,199,0,.20),transparent 60%),radial-gradient(ellipse 50% 60% at 0% 100%,rgba(96,44,138,.45),transparent 70%)\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:88px 24px 96px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:64px;align-items:center\">\n    <div style=\"max-width:600px\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:24px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#FFC700\">\n        <span style=\"width:24px;height:2px;background:#FFC700\"><\u002Fspan>\n        Residencial e empresarial\n      <\u002Fdiv>\n      <h1 style=\"font-size:clamp(40px,6vw,72px);line-height:1.02;letter-spacing:-.035em;font-weight:500;margin:0 0 24px;text-wrap:balance\">Seu projeto solar do início ao fim.<\u002Fh1>\n      <p style=\"font-size:18px;line-height:1.6;color:#D9CCE6;margin:0 0 36px;max-width:520px;text-wrap:pretty\">Reduza até {{pctLabel}} da sua conta de luz. A ON Solar dimensiona, homologa junto à concessionária, instala e acompanha o seu sistema fotovoltaico — com a entrega mais rápida do Brasil.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:12px 36px\">\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font-size:28px;font-weight:500;letter-spacing:-.02em\">+10 mil<\u002Fspan>\n          <span style=\"font-size:13px;color:#B9A6CC\">sistemas instalados<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font-size:28px;font-weight:500;letter-spacing:-.02em\">167<\u002Fspan>\n          <span style=\"font-size:13px;color:#B9A6CC\">municípios atendidos<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font-size:28px;font-weight:500;letter-spacing:-.02em;color:#FFC700\">{{pctLabel}}<\u002Fspan>\n          <span style=\"font-size:13px;color:#B9A6CC\">de economia possível<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- SIMULADOR -->\n    <div id=\"simular\" style=\"scroll-margin-top:96px;background:linear-gradient(180deg,#3A1A52,#311545);border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 24px 60px rgba(0,0,0,.45);padding:28px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#FFC700\">Simulador<\u002Fspan>\n          <span style=\"font-size:22px;font-weight:500;letter-spacing:-.015em\">Quanto você vai economizar<\u002Fspan>\n        <\u002Fdiv>\n        <i class=\"ph ph-sun-horizon\" style=\"font-size:32px;color:#FFC700\"><\u002Fi>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{isSim}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;background:#270D3A;border-radius:8px;padding:4px;gap:4px\">\n            <button sc-camel-on-click=\"{{setRes}}\" style=\"height:38px;border:0;border-radius:6px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;background:{{resBg}};color:{{resFg}}\">Residencial<\u002Fbutton>\n            <button sc-camel-on-click=\"{{setCom}}\" style=\"height:38px;border:0;border-radius:6px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;background:{{comBg}};color:{{comFg}}\">Empresa<\u002Fbutton>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:10px\">\n            <span style=\"font-size:13px;color:#D9CCE6\">Valor médio da sua conta de luz<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:8px;height:52px;padding:0 16px;border-radius:8px;background:#270D3A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)\">\n              <span style=\"font-size:18px;color:#B9A6CC\">R$<\u002Fspan>\n              <input type=\"number\" inputmode=\"numeric\" min=\"0\" value=\"{{conta}}\" sc-camel-on-change=\"{{onConta}}\" aria-label=\"Valor da conta em reais\" style=\"flex:1;min-width:0;background:transparent;border:0;outline:none;color:#FFFFFF;font:inherit;font-size:24px;font-weight:500\">\n              <span style=\"font-size:13px;color:#B9A6CC\">/mês<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" min=\"{{minConta}}\" max=\"{{maxConta}}\" step=\"50\" value=\"{{conta}}\" sc-camel-on-change=\"{{onConta}}\" aria-label=\"Ajustar valor da conta\" style=\"width:100%\">\n          <\u002Flabel>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n            <div style=\"background:#270D3A;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-size:12px;color:#B9A6CC\">Economia mensal<\u002Fspan>\n              <span style=\"font-size:26px;font-weight:500;letter-spacing:-.02em;color:#FFC700\">{{mensal}}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#270D3A;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-size:12px;color:#B9A6CC\">Economia anual<\u002Fspan>\n              <span style=\"font-size:26px;font-weight:500;letter-spacing:-.02em\">{{anual}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{goLead}}\" style=\"height:48px;border-radius:8px;border:1px solid #FFC700;background:{{ctaBg}};color:{{ctaFg}};font:inherit;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px\" style-hover=\"background:rgba(255,199,0,.16)\">Receber proposta personalizada <i class=\"ph ph-arrow-right\"><\u002Fi><\u002Fbutton>\n          <p style=\"margin:0;font-size:12px;line-height:1.5;color:#9C88B0\">Estimativa de até {{pctLabel}} sobre o consumo. Taxa mínima de disponibilidade e iluminação pública seguem cobradas pela concessionária.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{isLead}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;background:#270D3A;border-radius:8px;padding:14px 16px\">\n            <span style=\"font-size:13px;color:#B9A6CC\">Sua economia estimada<\u002Fspan>\n            <span style=\"font-size:20px;font-weight:500;color:#FFC700\">{{anual}}/ano<\u002Fspan>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:13px;color:#D9CCE6\">Nome<\u002Fspan>\n            <input value=\"{{nome}}\" sc-camel-on-change=\"{{onNome}}\" placeholder=\"Seu nome completo\" style=\"height:46px;padding:0 14px;border-radius:8px;border:0;background:#270D3A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:#FFFFFF;font:inherit;font-size:15px\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:13px;color:#D9CCE6\">WhatsApp<\u002Fspan>\n            <input type=\"tel\" value=\"{{whats}}\" sc-camel-on-change=\"{{onWhats}}\" placeholder=\"(00) 00000-0000\" style=\"height:46px;padding:0 14px;border-radius:8px;border:0;background:#270D3A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:#FFFFFF;font:inherit;font-size:15px\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:13px;color:#D9CCE6\">Cidade<\u002Fspan>\n            <input value=\"{{cidade}}\" sc-camel-on-change=\"{{onCidade}}\" placeholder=\"Cidade / UF\" style=\"height:46px;padding:0 14px;border-radius:8px;border:0;background:#270D3A;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);color:#FFFFFF;font:inherit;font-size:15px\">\n          <\u002Flabel>\n          <sc-if value=\"{{erro}}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:13px;color:#FFC700;display:flex;gap:6px;align-items:center\"><i class=\"ph ph-warning-circle\"><\u002Fi>{{erro}}<\u002Fspan>\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:10px\">\n            <button sc-camel-on-click=\"{{goSim}}\" style=\"height:48px;padding:0 16px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#D9CCE6;font:inherit;font-size:14px;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.06)\">Voltar<\u002Fbutton>\n            <button sc-camel-on-click=\"{{enviar}}\" style=\"flex:1;height:48px;border-radius:8px;border:1px solid #FFC700;background:{{ctaBg}};color:{{ctaFg}};font:inherit;font-size:15px;font-weight:500;cursor:pointer\" style-hover=\"background:rgba(255,199,0,.16)\">Quero minha proposta<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{isDone}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:14px;padding:12px 0 4px\">\n          <i class=\"ph ph-check-circle\" style=\"font-size:44px;color:#FFC700\"><\u002Fi>\n          <span style=\"font-size:22px;font-weight:500;letter-spacing:-.015em\">Recebemos, {{primeiroNome}}.<\u002Fspan>\n          <p style=\"margin:0;font-size:15px;line-height:1.6;color:#D9CCE6\">Abrimos uma conversa no WhatsApp da ON Solar com os dados da sua simulação. Envie a mensagem e um consultor responde com o dimensionamento do sistema para {{cidade}}.<\u002Fp>\n          <a href=\"https://wa.me/5584986244244\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500\"><i class=\"ph ph-whatsapp-logo\" style=\"font-size:18px\"><\u002Fi>Não abriu? Fale no (84) 98624-4244<\u002Fa>\n          <button sc-camel-on-click=\"{{reset}}\" style=\"align-self:flex-start;height:40px;padding:0 14px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#D9CCE6;font:inherit;font-size:14px;cursor:pointer\" style-hover=\"background:rgba(255,255,255,.06)\">Nova simulação<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- STAT BAND -->\n<section data-screen-label=\"Números\" style=\"background:linear-gradient(100deg,#3B1660,#4A1D78 55%,#3B1660);position:relative\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:56px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:32px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <span style=\"width:20px;height:2px;background:#FFC700\"><\u002Fspan>\n      <span style=\"font-size:44px;font-weight:500;letter-spacing:-.03em;line-height:1\">+10 mil<\u002Fspan>\n      <span style=\"font-size:15px;color:#E4D8EF\">sistemas solares instalados<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <span style=\"width:20px;hei Q -->\n<section id=\"faq\" data-screen-label=\"FAQ\" style=\"scroll-margin-top:72px\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:64px 24px 112px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:56px;align-items:start\">\n    <div style=\"max-width:380px\">\n      <span style=\"font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#FFC700\">Dúvidas frequentes<\u002Fspan>\n      <h2 style=\"font-size:clamp(30px,4vw,44px);line-height:1.08;letter-spacing:-.03em;font-weight:500;margin:12px 0 16px\">Antes de começar.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.6;color:#B9A6CC;margin:0\">Não encontrou sua pergunta? Faça a simulação e um consultor responde pelo WhatsApp.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;min-width:0\">\n      <sc-for list=\"{{faqs}}\" as=\"f\" hint-placeholder-count=\"6\">\n        <div style=\"height:1px;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.14) 70%,transparent)\"><\u002Fdiv>\n        <div>\n          <button sc-camel-on-click=\"{{f.toggle}}\" aria-expanded=\"{{f.open}}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;background:transparent;border:0;color:#FFFFFF;font:inherit;font-size:17px;font-weight:500;text-align:left;cursor:pointer\" style-hover=\"color:#FFE07A\">\n            <span>{{f.q}}<\u002Fspan>\n            <i class=\"ph {{f.icon}}\" style=\"font-size:18px;color:#FFC700;flex:none\"><\u002Fi>\n          <\u002Fbutton>\n          <sc-if value=\"{{f.open}}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin:0;padding:0 40px 24px 0;font-size:15px;line-height:1.65;color:#B9A6CC;text-wrap:pretty\">{{f.a}}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA FINAL -->\n<section data-screen-label=\"CTA final\" style=\"background:radial-gradient(ellipse 50% 90% at 100% 100%,rgba(255,199,0,.18),transparent 65%),linear-gradient(100deg,#3B1660,#4A1D78)\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:88px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:32px\">\n    <div style=\"max-width:640px\">\n      <h2 style=\"font-size:clamp(32px,4.5vw,52px);line-height:1.04;letter-spacing:-.035em;font-weight:500;margin:0 0 14px;text-wrap:balance\">Ligue o seu <span style=\"color:#FFC700\">+<\u002Fspan>ON.<\u002Fh2>\n      <p style=\"font-size:18px;line-height:1.55;color:#E4D8EF;margin:0\">Descubra em segundos quanto sua casa ou empresa pode economizar.<\u002Fp>\n    <\u002Fdiv>\n    <a href=\"#simular\" style=\"display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px;border-radius:8px;border:1px solid #FFC700;color:{{ctaFg}};background:{{ctaBg}};font-size:16px;font-weight:500\" style-hover=\"background:rgba(255,199,0,.16)\">Simular economia <i class=\"ph ph-arrow-up-right\"><\u002Fi><\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"max-width:1200px;margin:0 auto;padding:40px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px\">\n  <img src=\"e05dbe62-ee13-4fad-9e24-d870b72566af\" alt=\"ON Solar\" style=\"height:40px;width:auto;mix-blend-mode:lighten\">\n  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:24px\">\n    <a href=\"https://wa.me/5584986244244\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500\"><i class=\"ph ph-whatsapp-logo\" style=\"font-size:18px\"><\u002Fi>(84) 98624-4244<\u002Fa>\n    <span style=\"font-size:13px;color:#9C88B0\">© 2026 ON Solar · Energia solar residencial e empresarial<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;economiaPct&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:95,&quot;min&quot;:50,&quot;max&quot;:95,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Simulador&quot;},&quot;ctaStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;contorno&quot;,&quot;sólido&quot;],&quot;default&quot;:&quot;contorno&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Botões&quot;}}\">\nclass Component extends DCLogic {\n  state = { conta: 600, tipo: 'res', step: 'sim', nome: '', whats: '', cidade: '', erro: '', faq: 0 };\n  brl(v) { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }); }\n  maskTel(v) {\n    const d = v.replace(/\\D/g, '').slice(0, 11);\n    if (d.length <= 2) return d.length ? '(' + d : '';\n    if (d.length <= 7) return '(' + d.slice(0, 2) + ') ' + d.slice(2);\n    return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);\n  }\n  renderVals() {\n    const s = this.state;\n    const pct = Math.min(95, Math.max(50, this.props.economiaPct ?? 95)) / 100;\n    const solid = (this.props.ctaStyle ?? 'contorno') === 'sólido';\n    const conta = Number(s.conta) || 0;\n    const mensal = conta * pct;\n    const com = s.tipo === 'com';\n    const open = i => s.faq === i;\n    const faqs = [\n      ['Funciona em dias nublados e à noite?', 'Em dias nublados a geração diminui, mas continua. À noite você usa a energia da rede, compensada pelos créditos gerados durante o dia — o excedente injetado vira crédito na concessionária.'],\n      ['Quem cuida da homologação com a concessionária?', 'A ON Solar. Elaboramos o projeto elétrico, solicitamos o acesso, acompanhamos a vistoria e a troca do medidor. Você só acompanha.'],\n      ['Quanto tempo leva do contrato à conexão?', 'Depende do porte do sistema e dos prazos da concessionária local. Nossa operação é estruturada para a entrega mais rápida do Brasil — o consultor informa o cronograma exato na proposta.'],\n      ['Por que a economia não chega a 100%?', 'A concessionária mantém a cobrança da taxa mínima de disponibilidade e da iluminação pública. Por isso falamos em até ' + Math.round(pct * 100) + '% de redução.'],\n      ['O sistema precisa de manutenção?', 'Pouca. Limpeza periódica dos módulos e monitoramento da geração. Inversores e módulos contam com a garantia dos fabricantes.'],\n      ['O que preciso para pedir uma proposta?', 'Uma conta de luz recente e o endereço da instalação. Com isso dimensionamos o sistema ideal para o seu consumo.']\n    ].map(([q, a], i) => ({ q, a, open: open(i), icon: open(i) ? 'ph-minus' : 'ph-plus', toggle: () => this.setState({ faq: open(i) ? -1 : i }) }));\n    return {\n      pctLabel: Math.round(pct * 100) + '%',\n      ctaBg: solid ? '#FFC700' : 'transparent',\n      ctaFg: solid ? '#270D3A' : '#FFC700',\n      conta: s.conta, minConta: 100, maxConta: com ? 30000 : 3000,\n      mensal: this.brl(mensal), anual: this.brl(mensal * 12),\n      resBg: com ? 'transparent' : '#4A1D78', resFg: com ? '#B9A6CC' : '#FFFFFF',\n      comBg: com ? '#4A1D78' : 'transparent', comFg: com ? '#FFFFFF' : '#B9A6CC',\n      setRes: () => this.setState({ tipo: 'res', conta: Math.min(Number(s.conta) || 600, 3000) }),\n      setCom: () => this.setState({ tipo: 'com', conta: Math.max(Number(s.conta) || 0, 3000) }),\n      onConta: e => this.setState({ conta: e.target.value }),\n      isSim: s.step === 'sim', isLead: s.step === 'lead', isDone: s.step === 'done',\n      goLead: () => this.setState({ step: 'lead', erro: '' }),\n      goSim: () => this.setState({ step: 'sim' }),\n      nome: s.nome, whats: s.whats, cidade: s.cidade, erro: s.erro,\n      primeiroNome: s.nome.trim().split(' ')[0],\n      onNome: e => this.setState({ nome: e.target.value }),\n      onWhats: e => this.setState({ whats: this.maskTel(e.target.value) }),\n      onCidade: e => this.setState({ cidade: e.target.value }),\n      enviar: () => {\n        if (!s.nome.trim()) return this.setState({ erro: 'Informe seu nome.' });\n        if (s.whats.replace(/\\D/g, '').length < 10) return this.setState({ erro: 'Informe um WhatsApp válido com DDD.' });\n        if (!s.cidade.trim()) return this.setState({ erro: 'Informe sua cidade.' });\n        const msg = 'Olá, ON Solar! Fiz a simulação no site.\\n' +\n          'Nome: ' + s.nome.trim() + '\\nWhatsApp: ' + s.whats + '\\nCidade: ' + s.cidade.trim() +\n          '\\nTipo: ' + (com ? 'Empresa' : 'Residencial') + '\\nConta média: ' + this.brl(conta) +\n          '\\nEconomia estimada: ' + this.brl(mensal) + '/mês (' + this.brl(mensal * 12) + '/ano)';\n        window.open('https://wa.me/5584986244244?text=' + encodeURIComponent(msg), '_blank', 'noopener,noreferrer');\n        this.setState({ step: 'done', erro: '' });\n      },\n      reset: () => this.setState({ step: 'sim', nome: '', whats: '', cidade: '' }),\n      etapas: [\n        { n: '01', icon: 'ph-calculator', t: 'Simulação', d: 'Você informa o valor da conta e recebe uma estimativa de economia na hora.' },\n        { n: '02', icon: 'ph-clipboard-text', t: 'Visita técnica', d: 'Avaliamos telhado, orientação solar, sombreamento e padrão de entrada.' },\n        { n: '03', icon: 'ph-ruler', t: 'Projeto e homologação', d: 'Dimensionamento do sistema e aprovação junto à concessionária.' },\n        { n: '04', icon: 'ph-solar-panel', t: 'Instalação', d: 'Equipe própria instala módulos, inversor e proteções com agilidade.' },\n        { n: '05', icon: 'ph-lightning', t: 'Conexão e monitoramento', d: 'Sistema ligado à rede e geração acompanhada pelo aplicativo.' }\n      ],\n      beneficios: [\n        { icon: 'ph-trend-down', t: 'Até ' + Math.round(pct * 100) + '% menos na conta de luz', d: 'O sistema é dimensionado pelo seu histórico de consumo para compensar quase toda a energia que você usa.' },\n        { icon: 'ph-shield-check', t: 'Proteção contra aumentos de tarifa', d: 'Quem gera a própria energia sente muito menos os reajustes e as bandeir
